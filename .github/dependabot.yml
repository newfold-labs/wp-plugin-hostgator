version: 2

# Registries must be declared so Dependabot's proxy allows egress to them.
registries:
  newfold-satis:
    type: composer-repository
    url: https://newfold-labs.github.io/satis/

updates:

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    allow:
      - dependency-type: direct
    schedule:
      interval: "daily"
    commit-message:
      prefix: "GitHub Actions"
      include: "scope"
    labels:
      - "dependencies"

  # Maintain dependencies for npm
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "develop"
    allow:
      - dependency-type: direct
    schedule:
      interval: "daily"
    versioning-strategy: increase
    commit-message:
      prefix: "NPM"
      prefix-development: "NPM Dev"
      include: "scope"
    labels:
      - "dependencies"
      - "javascript"

  # Maintain dependencies for Composer
  - package-ecosystem: "composer"
    directory: "/"
    registries:
      - newfold-satis
    target-branch: "develop"
    schedule:
      interval: "daily"
    allow:
      - dependency-type: direct
    versioning-strategy: increase
    commit-message:
      prefix: "Composer"
      prefix-development: "Composer Dev"
      include: "scope"
    labels:
      - "dependencies"
      - "php"
