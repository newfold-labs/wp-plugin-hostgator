version: 2
updates:

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    allow:
      - dependency-type: direct
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "GitHub Actions"
      include: "scope"
    labels:
      - "dependencies"
      - "workflows"

  # Maintain dependencies for npm
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "develop"
    allow:
      - dependency-type: direct
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    versioning-strategy: increase
    commit-message:
      prefix: "NPM"
      prefix-development: "NPM Dev"
      include: "scope"
    labels:
      - "dependencies"
      - "javascript"

  # Maintain dependencies for Composer
  - package-ecosystem: "composer"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    allow:
      - dependency-type: direct
    versioning-strategy: increase
    commit-message:
      prefix: "Composer"
      prefix-development: "Composer Dev"
      include: "scope"
    labels:
      - "dependencies"
      - "php"

  # Maintain the isolated PHP-Scoper tooling used for namespace prefixing
  - package-ecosystem: "composer"
    directory: "/bin/php-scoper"
    target-branch: "develop"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    allow:
      - dependency-type: direct
    versioning-strategy: increase
    commit-message:
      prefix: "Composer"
      include: "scope"
    labels:
      - "dependencies"
      - "php"
