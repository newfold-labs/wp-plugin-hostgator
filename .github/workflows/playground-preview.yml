name: WordPress Playground Preview (PR & Comments)

on:
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

jobs:
  playground-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event.pull_request.head.repo.fork == false
    outputs:
      zip_url: ${{ steps.preview_urls.outputs.zip_url }}

    permissions:
      contents: read          # Required to clone the repo.
      pull-requests: write    # Required for github-script to upsert PR comments.
      pages: write            # Required to publish and update GitHub Pages.
      id-token: write         # Required for OIDC authentication to GitHub Pages.
      actions: write          # Required to list and delete stale github-pages workflow artifacts before upload.

    concurrency:
      group: pages-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Resolve PR context (number/branch/commit)
        id: ctx
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            let prNumber, branch, sha, commit;

            if (context.eventName === 'pull_request') {
              prNumber = context.payload.pull_request.number;
              branch   = context.payload.pull_request.head.ref;
              commit   = context.payload.pull_request.head.sha.slice(0,7);
            } else {
              prNumber = context.payload.issue.number;

              const { data: pr } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              });
              branch = pr.head.ref;
              sha    = pr.head.sha;
              commit = pr.head.sha.slice(0,7);
            }

            core.setOutput('number', prNumber.toString());
            core.setOutput('branch', branch);
            core.setOutput('sha', sha);
            core.setOutput('commit', commit);

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962  # v2.40.0
        with:
          php-version: '8.3'
          coverage: none
          tools: composer, cs2pr

      - name: Use Node from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Setup workflow context
        id: workflow
        working-directory: ${{ runner.temp }}
        env:
          PLUGIN_NAME: ${{ vars.PLUGIN_NAME }}
        run: |
          mkdir dist
          echo "DIST=${PWD}/dist" >> "$GITHUB_OUTPUT"
          echo "PACKAGE=$PLUGIN_NAME" >> "$GITHUB_OUTPUT"

      - name: Install PHP Dependencies
        run: composer install --no-progress --no-dev --optimize-autoloader --prefer-dist

      - name: NPM Install
        run: npm install

      - name: Build JavaScript
        run: npm run build

      - name: Prepare files
        env:
          DIST: ${{ steps.workflow.outputs.DIST }}
        run: |
          rsync -r --include-from=.distinclude --exclude-from=.distignore . "$DIST"

      - name: List dist files (debug)
        env:
          DIST: ${{ steps.workflow.outputs.DIST }}
        run: |
          set -euo pipefail
          cd -- "$DIST"
          find .

      - name: Prepare plugin zip for GitHub Pages
        id: prepare
        env:
          DIST: ${{ steps.workflow.outputs.DIST }}
          PR_NUMBER: ${{ steps.ctx.outputs.number }}
        run: |
          set -euo pipefail

          mkdir -p gh-pages/previews

          PR_NUM="$PR_NUMBER"
          ZIP_NAME="hostgator-pr-${PR_NUM}.zip"

          # Create excludes.txt inside the DIST folder
          cat > "$DIST/excludes.txt" <<'EOF'
          .env
          .env.*
          .npmrc
          .yarnrc*
          auth.json
          composer.auth.json
          wp-config.php
          .git*
          **/.git/**
          **/node_modules/**
          **/.github/**
          **/.vscode/**
          **/.idea/**
          EOF

          # Zip inside DIST using the local excludes.txt file
          cd "$DIST"
          zip -r -9 "../${ZIP_NAME}" . -x@excludes.txt
          cd -

          # Move the ZIP inside gh-pages/previews
          mv "${DIST}/../${ZIP_NAME}" "gh-pages/previews/${ZIP_NAME}"

          SIZE=$(du -h "gh-pages/previews/${ZIP_NAME}" | cut -f1)

          echo "zip_name=${ZIP_NAME}" >> "$GITHUB_OUTPUT"
          echo "zip_size=${SIZE}" >> "$GITHUB_OUTPUT"

          cat > gh-pages/previews/index.html <<EOF
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8" />
            <title>HostGator Plugin - Playground Previews</title>
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 800px; margin: 40px auto; padding: 20px; }
              h1 { color: #333; }
              .preview { background: #f5f5f5; padding: 15px; margin: 10px 0; border-radius: 5px; }
              a { color: #0969da; text-decoration: none; }
              a:hover { text-decoration: underline; }
              code { background:#eee; padding:2px 6px; border-radius:4px; }
            </style>
          </head>
          <body>
            <h1>🎮 WordPress Playground Previews</h1>
            <p>Preview builds of the HostGator WordPress Plugin for testing in WordPress Playground.</p>
            <div class="preview">
              <p><strong>Latest:</strong> <a href="${ZIP_NAME}">${ZIP_NAME}</a> (${SIZE})</p>
            </div>
          </body>
          </html>
          EOF

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          enablement: true
      - name: Cleanup previous github-pages artifacts for this run
        id: cleanup_pages_artifacts
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RUN_ID: ${{ github.run_id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const runId = process.env.RUN_ID;

            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });

            for (const artifact of data.artifacts) {
              if (artifact.name === 'github-pages') {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
                core.info(`Deleted old github-pages artifact ${artifact.id}`);
              }
            }

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./gh-pages

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      - name: Export preview URLs for downstream jobs
        id: preview_urls
        env:
          PAGES_URL: ${{ steps.deploy.outputs.page_url }}
          ZIP_NAME: ${{ steps.prepare.outputs.zip_name }}
        run: |
          set -euo pipefail
          BASE="${PAGES_URL%/}"
          echo "zip_url=${BASE}/previews/${ZIP_NAME}" >> "$GITHUB_OUTPUT"

      - name: Comment Playground link on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PR_NUMBER: ${{ steps.ctx.outputs.number }}
          ZIP_NAME: ${{ steps.prepare.outputs.zip_name }}
          ZIP_SIZE: ${{ steps.prepare.outputs.zip_size }}
          COMMIT: ${{ steps.ctx.outputs.commit }}
          BRANCH: ${{ steps.ctx.outputs.branch }}
          PAGES_URL: ${{ steps.deploy.outputs.page_url }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            const zipName  = process.env.ZIP_NAME;
            const zipSize  = process.env.ZIP_SIZE;
            const commit   = process.env.COMMIT;
            const branch   = process.env.BRANCH;
            const baseUrl  = process.env.PAGES_URL.replace(/\/+$/, '');
            const zipUrl   = `${baseUrl}/previews/${zipName}`;

            const blueprint = {
              landingPage: "/wp-admin/admin.php?page=hostgator#/home",
              preferredVersions: { php: "8.1", wp: "latest" },
              login: true,
              steps: [
                {
                  step: "installPlugin",
                  pluginData: { resource: "url", url: zipUrl },
                  options: { activate: true }
                }
              ]
            };

            const blueprintBase64 = Buffer
              .from(JSON.stringify(blueprint))
              .toString('base64');

            const playgroundUrl = `https://playground.wordpress.net/#${blueprintBase64}`;

            const commentMeta = '<!-- playground-preview-link -->';
            const body = `
            ${commentMeta}
            ## 🎮 WordPress Playground Preview

            [**▶️ Launch Preview in Playground**](${playgroundUrl})

            _This spins up a fresh WordPress-in-browser, installs this PR's plugin build, and drops you straight into the HostGator screen._

            ---
            **Preview Details**
            - 📦 Build ZIP: \`${zipName}\` (${zipSize})
            - 🗂️ Branch: \`${branch}\`
            - 📝 Commit: \`${commit}\`
            - 🔗 [Direct Download of ZIP](${zipUrl})

            ⚠ Every new commit / comment on this PR overwrites the preview ZIP for this PR number.
            `;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const existing = comments.find(c => c.body && c.body.includes(commentMeta));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body,
              });
            }

  playwright-env-any:
    name: Playwright @env-any (Playground)
    runs-on: ubuntu-latest
    needs: playground-preview
    if: github.event.pull_request.head.repo.fork == false
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install Node dependencies
        run: npm install --legacy-peer-deps

      - name: Install Playwright Chromium
        timeout-minutes: 5
        run: npx playwright install chromium

      - name: Download PR preview plugin build
        env:
          ZIP_URL: ${{ needs.playground-preview.outputs.zip_url }}
        run: |
          set -euo pipefail
          PLUGIN_DIR="${RUNNER_TEMP}/hostgator-preview-plugin"
          rm -rf "$PLUGIN_DIR"
          mkdir -p "$PLUGIN_DIR"

          # The preview zip is served from GitHub Pages. Each Pages deploy replaces the
          # whole site, so a concurrent deploy for another PR (or Pages propagation lag)
          # can briefly 404 this URL. Retry with backoff, then fail loudly so a genuinely
          # broken preview pipeline doesn't go unnoticed.
          MAX_ATTEMPTS=8
          DELAY=5
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            if curl -fsSL "$ZIP_URL" -o "${RUNNER_TEMP}/preview.zip"; then
              echo "Downloaded preview zip on attempt ${attempt}."
              break
            fi
            if [ "$attempt" -eq "$MAX_ATTEMPTS" ]; then
              echo "::error::Preview zip not available at ${ZIP_URL} after ${MAX_ATTEMPTS} attempts."
              exit 1
            fi
            echo "Attempt ${attempt}/${MAX_ATTEMPTS} failed; retrying in ${DELAY}s..."
            sleep "$DELAY"
            DELAY=$(( DELAY * 2 > 60 ? 60 : DELAY * 2 ))
          done

          unzip -q "${RUNNER_TEMP}/preview.zip" -d "$PLUGIN_DIR"
          echo "PLAYGROUND_PLUGIN_DIR=$PLUGIN_DIR" >> "$GITHUB_ENV"

      - name: Run @env-any tests against Playground server
        env:
          CI: true
          PLAYWRIGHT_FORCE_ASYNC_LOADER: '1'
        run: npx playwright test --grep @env-any --project newfold-labs/wp-plugin-hostgator --reporter=line

      - name: Store Playwright test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-playground-env-any
          path: tests/playwright/test-results/
          retention-days: 10
