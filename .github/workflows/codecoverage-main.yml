name: Codecoverage-Main

# Runs PHPUnit unit and Codeception wp-browser wpunit tests, merges the code coverage, commits the html report to
# GitHub Pages, generates a README badge with the coverage percentage.

on:
  push:
    branches:
      - main
  pull_request:
    types: [ opened, reopened, ready_for_review, synchronize ]
    branches:
      - main
      - develop
      - release/*
  workflow_dispatch:

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

jobs:
  get-repo-name:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # No repository clone or token use; only parses github.repository for reusable workflow inputs.
    permissions: {}
    outputs:
      repository-name: ${{ steps.repo-name.outputs.name }}
    steps:
      - name: Extract repository name
        id: repo-name
        run: echo "name=$(echo ${{ github.repository }} | cut -d'/' -f2)" >> "$GITHUB_OUTPUT"

  codecoverage:
    needs: get-repo-name
    permissions:
      contents: write           # Required for reusable workflow to push coverage to GitHub Pages.
      pull-requests: write      # Required for reusable workflow to post or update PR comments.
    uses: newfold-labs/workflows/.github/workflows/reusable-codecoverage.yml@main
    with:
      php-versions: '["7.4", "8.0", "8.1", "8.2", "8.3", "8.4"]'
      coverage-php-version: '7.4'
      # composer install runs PHP-Scoper, which needs PHP >= 8.2. Tests still
      # run on each matrix PHP version; the lock file and the composer
      # platform config (php 7.4) keep the installed dependencies identical.
      install-php-version: '8.3'
      repository-name: ${{ needs.get-repo-name.outputs.repository-name }}
      minimum-coverage: 25
    secrets:
      repo_token: ${{ secrets.GITHUB_TOKEN }}
