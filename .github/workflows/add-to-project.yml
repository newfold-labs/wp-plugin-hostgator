name: Add issue to project

on:
  issues:
    types:
      - opened

# Disable permissions for all available scopes by default.
# Any needed permissions should be configured at the job level.
permissions: {}

jobs:
  add-to-project:
    name: Add issue to project
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: {} # Uses PROJECT_TOKEN; default GITHUB_TOKEN is not passed to add-to-project.

    steps:
      - uses: actions/add-to-project@f2c1f1fa649a891be84948ea89b5dfba1526ef05 # v2.0.1
        with:
          project-url: https://github.com/orgs/newfold-labs/projects/1
          github-token: ${{ secrets.PROJECT_TOKEN }}
